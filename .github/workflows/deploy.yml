name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          VITE_ADSENSE_CLIENT: ${{ vars.ADSENSE_CLIENT }}
          VITE_ADSENSE_SLOT_HUB: ${{ vars.ADSENSE_SLOT_HUB }}
          VITE_ADSENSE_SLOT_RESULTS: ${{ vars.ADSENSE_SLOT_RESULTS }}
          VITE_SUPPORTER_CHECKOUT_URL: ${{ vars.SUPPORTER_CHECKOUT_URL }}
      - name: Write ads.txt when AdSense is set up
        if: ${{ vars.ADSENSE_CLIENT != '' }}
        run: echo "google.com, ${ADSENSE_CLIENT#ca-}, DIRECT, f08c47fec0942fa0" > dist/ads.txt
        env:
          ADSENSE_CLIENT: ${{ vars.ADSENSE_CLIENT }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
